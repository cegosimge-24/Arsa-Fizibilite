<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parsel Fizibilite V6</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><b>PARSEL FİZİBİLİTE V6</b><span>Gerçek veri bağlantılı ön fizibilite</span></header><main>
<section class="card"><h1>Parsel Sorgula</h1><div class="grid"><label>İlçe<select id="district"><option>Sancaktepe</option><option>Üsküdar</option><option>Çekmeköy</option><option>Maltepe</option><option>Kartal</option><option>Pendik</option><option>Tuzla</option><option>Ataşehir</option><option>Ümraniye</option><option>Kadıköy</option><option>Beykoz</option><option>Şile</option></select></label><label>Mahalle<input id="neighborhood" placeholder="Sarıgazi"></label><label>Ada<input id="block" placeholder="702"></label><label>Parsel<input id="parcel" placeholder="1"></label></div><button onclick="lookup()">GERÇEK PARSELİ SORGULA</button><p id="status"></p></section>
<section id="result" class="hidden"><div class="grid two"><div class="card"><h2>Parsel</h2><div id="parcelData"></div></div><div class="card"><h2>İmar</h2><div id="zoningData"></div></div></div><div class="card"><h2>Plan Notları</h2><div id="notes">Veri bekleniyor.</div></div><div class="card"><h2>Fizibilite</h2><div class="grid"><label>Ortalama daire brüt m²<input id="apt" type="number" value="90"></label><label>Arsa fiyatı<input id="land" type="number"></label><label>İnşaat maliyeti / m²<input id="cost" type="number"></label><label>Satış fiyatı / m²<input id="sale" type="number"></label></div><button onclick="calculate()">HESAPLA</button><div id="finance"></div></div></section></main><script src="app.js"></script></body></html>
