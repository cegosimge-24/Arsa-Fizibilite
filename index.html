<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belediye İmar Fizibilite</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><b>BELEDİYE İMAR FİZİBİLİTE</b><small>İlçe belediyesi E-İmar + plan notları</small></header><main>
<section class="card"><h1>Parsel Deneme</h1><p>İlk pilot: Sancaktepe / Sarıgazi / 702 ada / 1 parsel</p>
<div class="grid"><label>İlçe<select id="district"><option>Sancaktepe</option><option>Çekmeköy</option><option>Üsküdar</option><option>Ümraniye</option><option>Ataşehir</option><option>Maltepe</option><option>Kartal</option><option>Pendik</option><option>Tuzla</option><option>Kadıköy</option><option>Beykoz</option><option>Şile</option></select></label>
<label>Mahalle<input id="neighborhood" value="Sarıgazi"></label><label>Ada<input id="block" value="702"></label><label>Parsel<input id="parcel" value="1"></label></div>
<button onclick="analyze()">BELEDİYE İMARINI SORGULA</button><div id="status"></div></section>
<section id="result" class="hidden"><div class="grid two"><div class="card"><h2>İmar Durumu</h2><div id="zoning"></div></div><div class="card"><h2>Plan Notları</h2><div id="notes"></div></div></div>
<div class="card"><h2>Daire Senaryosu</h2><div class="grid"><label>Parsel alanı (m²)<input id="area" type="number"></label><label>Emsal<input id="emsal" type="number" step="0.01"></label><label>Ortalama daire brüt m²<input id="size" type="number" value="90"></label></div><button onclick="calc()">HESAPLA</button><div id="calc"></div></div></section></main><script src="app.js"></script></body></html>
